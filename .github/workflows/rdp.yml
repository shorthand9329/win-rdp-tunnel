name: rdp

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: set runneradmin password
        run: net user runneradmin "1qaz@WSX"

      - name: enable rdp
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

      - name: cloudflared -> 127.0.0.1:3389
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          $p = Start-Process .\cloudflared.exe -ArgumentList 'tunnel','--url','tcp://127.0.0.1:3389','--no-autoupdate' -RedirectStandardError cf.log -PassThru -NoNewWindow
          $u = $null
          for ($i = 0; $i -lt 30 -and -not $u; $i++) {
            Start-Sleep 2
            $u = (Select-String -Path cf.log -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' | Select-Object -First 1).Matches.Value
          }
          Write-Output "TUNNEL_URL=$u"
          git config user.email runner@local; git config user.name runner
          git checkout -B state; Set-Content url.txt "TUNNEL_URL=$u"
          git add url.txt; git commit -m url; git push -f origin state
          $p.WaitForExit()
